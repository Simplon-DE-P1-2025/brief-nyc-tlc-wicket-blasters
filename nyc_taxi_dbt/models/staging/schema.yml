# models/staging/schema.yml
version: 2

sources:
  - name: raw
    database: NYC_TAXI_DB
    schema: RAW
    tables:
      - name: yellow_taxi_trips
        description: "Données brutes Yellow Taxi NYC 2024-2025"

models:
  - name: stg_yellow_trips
    description: >
      Données Yellow Taxi nettoyées et enrichies.
      Basées sur le Data Dictionary TLC du 18 mars 2025
      et les règles de qualité appliquées dans le projet.

    columns:

      - name: vendorid
        description: >
          Fournisseur TPEP ayant généré l'enregistrement.
          1 = Creative Mobile Technologies
          2 = Curb Mobility
          6 = Myle Technologies
          7 = Helix
        tests:
          - accepted_values:
              values: [1, 2, 6, 7]

      - name: pickup_datetime
        description: >
          Date et heure de prise en charge du passager.
        tests:
          - not_null

      - name: dropoff_datetime
        description: >
          Date et heure de dépose du passager.
        tests:
          - not_null

      - name: passenger_count
        description: >
          Nombre de passagers transportés.

      - name: trip_distance
        description: >
          Distance du trajet en miles.
          Filtrée dans le modèle de staging.
        tests:
          - not_null

      - name: ratecodeid
        description: >
          Code tarifaire final appliqué au trajet.
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 99]

      - name: store_and_fwd_flag
        description: >
          Y = trajet stocké localement avant transmission.
          N = transmis directement.

      - name: pulocationid
        description: >
          Zone TLC de prise en charge.

      - name: dolocationid
        description: >
          Zone TLC de dépose.

      - name: payment_type
        description: >
          Mode de paiement.
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6]

      - name: fare_amount
        description: >
          Tarif calculé par le taximètre.
        tests:
          - not_null

      - name: extra
        description: >
          Suppléments et surcharges diverses.

      - name: mta_tax
        description: >
          Taxe MTA appliquée automatiquement.

      - name: tip_amount
        description: >
          Pourboire enregistré (CB uniquement).

      - name: tolls_amount
        description: >
          Total des péages.

      - name: improvement_surcharge
        description: >
          Surcharge d'amélioration appliquée depuis 2015.

      - name: congestion_surcharge
        description: >
          Surcharge de congestion de l'État de New York.

      - name: airport_fee
        description: >
          Frais d'aéroport JFK/LGA.

      - name: cbd_congestion_fee
        description: >
          Péage de congestion MTA appliqué depuis le
          5 janvier 2025.

      - name: total_amount
        description: >
          Montant total facturé au passager.

      # Colonnes calculées dans le modèle DBT

      - name: trip_duration_minutes
        description: >
          Durée du trajet en minutes.
        tests:
          - not_null

      - name: avg_speed_mph
        description: >
          Vitesse moyenne calculée.

      - name: tip_rate
        description: >
          Pourcentage du pourboire par rapport au tarif.

      - name: distance_category
        description: >
          Catégorie de distance calculée.
        tests:
          - accepted_values:
              values: ['Short', 'Medium', 'Long', 'Very Long']

      - name: time_period
        description: >
          Période de la journée calculée.
        tests:
          - accepted_values:
              values: ['Morning', 'Afternoon', 'Evening', 'Night']
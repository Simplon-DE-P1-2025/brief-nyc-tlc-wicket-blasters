name: DBT CD - All Models

# Se déclenche à chaque push (ou merge de PR) sur master.
# Fait tourner tous les modèles dbt : staging + final.
on:
  push:
    branches:
      - master

jobs:
  dbt-cd:
    # Runner : VM Ubuntu fournie gratuitement par GitHub Actions
    runs-on: ubuntu-latest

    # Variables d'environnement injectées depuis les secrets du repo GitHub.
    # À configurer dans : Settings → Secrets and variables → Actions
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

    steps:
      # Clone le repo dans le runner pour que les étapes suivantes aient accès au code
      - name: Checkout
        uses: actions/checkout@v4

      # Installe Python 3.11 sur le runner
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # On installe uniquement dbt-snowflake, pas tout requirements.txt
      # (jupyter, matplotlib, etc. sont inutiles en CD et alourdiraient le runner)
      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==1.11.5

      # Installe les éventuels packages déclarés dans packages.yml
      - name: dbt deps
        working-directory: nyc_taxi_dbt
        run: dbt deps --profiles-dir .

      # Pas de --select : dbt tourne tous les modèles (staging + final)
      # --profiles-dir . indique à dbt de lire profiles.yml depuis nyc_taxi_dbt/
      - name: dbt run - all models
        working-directory: nyc_taxi_dbt
        run: dbt run --profiles-dir .

      # Exécute tous les tests définis dans les schema.yml de chaque couche
      - name: dbt test - all models
        working-directory: nyc_taxi_dbt
        run: dbt test --profiles-dir .
